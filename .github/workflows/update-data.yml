name: 定期更新加密貨幣資料

on:
  schedule:
    # 每4小時執行一次（加密貨幣24小時都在交易，不用像股市一樣只在平日）
    - cron: "0 */4 * * *"
  workflow_dispatch: {} # 允許手動在 GitHub 網頁上點選執行

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝依賴
        run: npm install --omit=dev

      - name: 執行資料更新
        run: node scripts/updateData.js

      - name: Commit 並推送資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "沒有資料變動" || git commit -m "chore: 自動更新加密貨幣資料 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
